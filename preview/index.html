<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿瓦隆 · 星图牌册</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#180e2d;color:#eee1d0;font-family:Georgia,'Songti SC','SimSun',serif}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 48% 42%,#302040 0,transparent 66%)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #dcab62;outline-offset:2px}::selection{background:#c5afd9;color:#24182e}.sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.shell{position:relative;max-width:1010px;margin:auto;padding:clamp(32px,7vh,80px) 38px 25px}header{display:flex;align-items:center;gap:14px}.seal{width:52px;color:#d6ba8b}.brand{font-size:clamp(28px,3vw,42px);font-weight:500;letter-spacing:.12em;margin:0}.folio{border-left:1px solid #9a879f;padding-left:15px;color:#d4c3d7;font-size:16px}.edition{margin-left:auto;text-align:right;font:12px Georgia;letter-spacing:.18em;color:#c3b0c6}.rule{height:7px;margin:10px 0 17px;border-top:1px solid #9a8495;border-bottom:1px solid #635466;position:relative}.rule:after{content:'◆';position:absolute;top:-9px;right:7%;color:#d7b98c;font-size:12px}nav{display:flex;gap:12px;align-items:center}.tab{background:#a396b1;padding:1px;border:0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);color:#ede1ec}.tab span{display:block;padding:5px 22px;background:#211a35;clip-path:inherit}.tab[aria-pressed=true] span{background:#d5c4dc;color:#281d36}.note{margin-left:auto;color:#c9b7c6;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 26px;margin:24px 4.3%}.card{position:relative;min-width:0;background:#24223f;border:3px double #e1d1c1;border-radius:8px;padding:3px;box-shadow:0 5px 14px #0d081b}.card:before,.card:after{content:'✧';z-index:1;position:absolute;top:1px;color:#ebd9aa;pointer-events:none;font-size:16px}.card:before{left:5px}.card:after{right:5px}.title{display:block;width:100%;height:32px;background:#242441;color:#fff0df;border:1px solid #bbabbe;border-radius:5px 5px 0 0;text-align:center;font-weight:600;padding:0 13px;text-overflow:ellipsis}.plate{display:block;width:100%;aspect-ratio:2.4;border-inline:1px solid #ada1b4;background:#22223e}.paper{background:linear-gradient(110deg,#f6efdf,#eaddce);color:#3d3146;padding:9px 9px 8px;border:1px solid #ae9ba5}.meta{font:10px Georgia;letter-spacing:.14em;color:#716174}.progress{display:flex;align-items:baseline;justify-content:space-between;gap:2px}.value{font:32px/1.2 Georgia;color:#332942}.unit{font:12px 'Microsoft YaHei',sans-serif;color:#66576a}.steps{display:inline-flex;align-self:center;gap:1px}.steps button{width:26px;height:27px;padding:0;color:#423448;background:#efe4d7;border:1px solid #ad99a4;font:18px Georgia}.steps button:hover{background:#dac8d6}.status{display:block;width:100%;background:#d7c6e1;border:1px solid #a99ab2;color:#3f3450;padding:4px;font-size:13px;border-radius:0 0 4px 4px}.status[aria-pressed=true]{background:#c7c0b6;color:#49414a}.status:before{content:'□';margin-right:6px}.status[aria-pressed=true]:before{content:'☑'}.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #79667d;padding-top:12px;color:#bfacc1;font-size:12px}.foot b{color:#ddc998;font:14px Georgia;letter-spacing:.2em}.web{grid-column:span 2;background:#f1e7d8;color:#392e41;border:4px double #887692;padding:16px}.web h2{margin:0 0 8px;font-size:20px}.web a{color:#49385e;overflow-wrap:anywhere}.web p{font-size:13px}.web button{background:#332941;color:#fff0dc;border:0;padding:7px 16px}
.shell{max-width:580px;padding:clamp(24px,6vh,54px) clamp(12px,4vw,26px)}
.grid{grid-template-columns:minmax(0,1fr);margin:18px 0;gap:5px}
.card{display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"check title progress";align-items:center;min-height:48px;padding:0 5px 0 0;border-radius:4px;box-shadow:none;background:#28213b}
.card:before,.card:after,.card .plate,.card .meta{display:none}
.card .status{grid-area:check;align-self:stretch;font-size:0;border:0;background:transparent;color:#dfcda9}
.card .status:before{display:inline-grid;place-items:center;box-sizing:border-box;content:"";width:17px;height:17px;margin:0;border:1px solid currentColor;border-radius:2px}
.card .status[aria-pressed=true]:before{content:"✓";font:15px/1 sans-serif;background:#d5c6ac;color:#302439}
.card .title{grid-area:title;min-width:0;height:40px;padding:0 3px;background:transparent;border:0;border-radius:0;text-align:left;font-size:16px;font-weight:500}
.card:has(.status[aria-pressed=true]) .title{color:#beb0c2;text-decoration:line-through}
.card .paper{grid-area:progress;background:transparent;border:0;padding:0 0 0 5px}
.progress{align-items:center;gap:5px}.value{font-size:20px;color:#f1e2c9;font-variant-numeric:tabular-nums}.unit{color:#c8b8c8}
.steps{gap:0}.steps button{height:36px;width:29px;background:transparent;color:#e7d8bd;border-color:#72647a}.steps button+button{border-left:0}.steps button:hover{background:#40364c}
.web{grid-column:1/-1}.tab{flex:1}.tab span{padding:7px 0}.note{display:none}nav{gap:7px}.folio{font-size:14px;padding-left:10px}.seal{width:38px}header{gap:8px}.foot{font-size:11px}
#dust{fill:#b4a4bf}.edition,.meta{font-size:11px}
</style>
